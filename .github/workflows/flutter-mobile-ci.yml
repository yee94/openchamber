name: Flutter Mobile CI

# Automatic smoke on the independent Flutter track. Does not replace
# Capacitor `.github/workflows/mobile-ci.yml` on main.
on:
  push:
    branches:
      - work/flutter-native
      - cursor/flutter-native-8ab3
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter-mobile-ci.yml'
      - '.github/workflows/flutter-mobile-release.yml'
      - 'docs/flutter-native-gap.md'
  pull_request:
    branches:
      - main
      - work/flutter-native
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/flutter-mobile-ci.yml'
      - '.github/workflows/flutter-mobile-release.yml'
      - 'docs/flutter-native-gap.md'
  workflow_dispatch:

concurrency:
  group: flutter-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Flutter analyze and widget tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Widget tests
        run: flutter test

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android debug APK
        working-directory: apps/mobile_flutter
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-flutter-android-debug-apk
          path: apps/mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-15
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build iOS simulator app
        working-directory: apps/mobile_flutter
        run: |
          # Builds Runner plus OpenChamberWidget / NSE / Share extension targets.
          # --no-codesign skips signing for the app; simulator often also skips
          # extension signing. Signed four-profile export is release YAML only.
          flutter build ios --simulator --no-codesign
